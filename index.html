<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Palawan Beneficiary Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { margin:0; padding:0; height:100%; font-family:"Segoe UI",Tahoma,Geneva,sans-serif; }
    #map { height:100vh; width:100vw; }

    .floating-title {
      position:absolute; top:15px; left:50%; transform:translateX(-50%);
      z-index:1000; background:rgba(255,255,255,.95); padding:10px 25px;
      border-radius:50px; box-shadow:0 4px 15px rgba(0,0,0,.2);
      text-align:center; pointer-events:none; white-space:nowrap;
    }
    .floating-title h1 { margin:0; font-size:20px; color:#333; text-transform:uppercase; letter-spacing:1px; }
    .floating-title p { margin:0; font-size:12px; color:#666; }

    .info {
      padding:12px 16px; background:rgba(255,255,255,.95);
      box-shadow:0 0 15px rgba(0,0,0,.2); border-radius:8px; min-width:220px;
    }
    .info h4 { margin:0 0 8px; color:#333; font-size:16px; border-bottom:1px solid #ddd; padding-bottom:4px; }

    .legend { line-height:22px; font-size:12px; }
    .legend strong { display:block; margin-bottom:6px; font-size:13px; }
    .legend i { width:16px; height:16px; float:left; margin-right:8px; margin-top:3px; opacity:.85; border-radius:2px; }

    #loader {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:9999; background:white; padding:20px 30px; border-radius:8px;
      box-shadow:0 4px 15px rgba(0,0,0,.2); font-weight:bold; text-align:center;
    }

    #errorToast {
      position:absolute; top:80px; left:50%; transform:translateX(-50%);
      z-index:10000; background:#c0392b; color:white; padding:10px 20px;
      border-radius:6px; display:none; font-size:13px;
      box-shadow:0 4px 10px rgba(0,0,0,.2); max-width:520px; text-align:center;
    }

    #backBtn {
      position:absolute; top:80px; left:20px; z-index:9999;
      padding:10px 20px; background:#0056b3; color:white;
      border:none; border-radius:4px; font-size:14px; cursor:pointer; display:none;
    }

    #tablePanel {
      position:absolute; bottom:0; left:0; width:100%; max-height:40vh;
      background:white; z-index:9998; box-shadow:0 -4px 15px rgba(0,0,0,.2);
      display:none; flex-direction:column; border-top:3px solid #0056b3;
    }
    .table-header {
      padding:10px 20px; background:#f8f9fa; border-bottom:1px solid #ddd;
      display:flex; justify-content:space-between; align-items:flex-start;
    }
    .refresh-info { font-size:12px; color:#666; margin-top:2px; }
    .btn-refresh { cursor:pointer; color:#0056b3; font-weight:bold; margin-left:10px; }
    .table-container { overflow-y:auto; flex-grow:1; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
    th, td { padding:8px 12px; border-bottom:1px solid #eee; }
    th { position:sticky; top:0; background:#fff; z-index:10; border-bottom:2px solid #ccc; }
    .clickable-th { color:#0056b3; cursor:pointer; text-decoration:underline; }

    @media(max-width:700px){
      .floating-title { top:8px; padding:8px 14px; white-space:normal; width:75%; }
      .floating-title h1 { font-size:16px; }
      .floating-title p { font-size:10px; }
      .info { min-width:180px; }
      #tablePanel { max-height:45vh; }
    }
  </style>
</head>

<body>
  <div class="floating-title">
    <h1>4Ps Beneficiary Dashboard</h1>
    <p>Palawan Provincial Operations Office</p>
    <p id="dataAsOf">Data as of: September 2, 2026</p>
  </div>

  <div id="loader">Kinukuha ang data...</div>
  <div id="errorToast"></div>
  <button id="backBtn" onclick="resetMap()">⬅ Bumalik sa Buong Palawan</button>

  <div id="map"></div>

  <div id="tablePanel">
    <div class="table-header">
      <div>
        <h3 id="panelTitle" style="margin:0 0 4px;">Municipality Data</h3>
        <div class="refresh-info">
          <span id="dataAsOfTable">Data as of: September 2, 2026</span> |
          <span id="lastRefreshTime">Latest refresh: Just now</span>
        </div>
        <button id="btnBackToSummary"
          style="display:none; cursor:pointer; border:none; background:none; color:#0056b3; padding:4px 0 0; font-size:13px;">
          ⬅ Bumalik sa Summary
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="btn-refresh" onclick="refreshData()">🔄 I-refresh</span>
        <button onclick="document.getElementById('tablePanel').style.display='none'"
          style="border:none; background:none; font-size:18px; cursor:pointer;">✖</button>
      </div>
    </div>
    <div class="table-container">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var PALAWAN_BOUNDS = L.latLngBounds(
      [7.6, 114.7],
      [12.7, 120.0]
    );

    var map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([9.8349,118.7384],8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.fitBounds(PALAWAN_BOUNDS, {padding:[20,20]});

    var sheetData = [];
    var municipalLayer = null;
    var hucLayer = null;
    var barangayLayer = null;
    var legendControl = null;
    var lockedArea = null;
    var cachedBrgyGeoJson = null;
    var currentBrgyData = [];
    var currentMuni = '';
    var currentView = 'province';
    var currentType = '';
    var breaks = [0,0,0,0];

    var muniGeoJsonUrl =
      'https://raw.githubusercontent.com/amosting92/beneficiary-distribution-map/main/assets/municipalities.geojson';
    var hucGeoJsonUrl =
      'https://raw.githubusercontent.com/amosting92/beneficiary-distribution-map/main/assets/highly_urbanized_cities.geojson';
    var brgyGeoJsonUrl =
      'https://raw.githubusercontent.com/amosting92/beneficiary-distribution-map/main/assets/barangays.geojson';

    function normalizeName(value) {
      return String(value || '')
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/[^A-Z0-9]/g,'');
    }

    function featureName(feature, fallback) {
      var p = feature && feature.properties ? feature.properties : {};

      var candidates = [
        p.ADM3_EN, p.NAME_2, p.NAME2, p.MUNICIPALITY,
        p.MUNICIPAL, p.CITY, p.CITY_NAME, p.MUN_NAME,
        p.MUNNAME, p.NAME, p.name
      ];

      for (var i=0; i<candidates.length; i++) {
        if (String(candidates[i] || '').trim()) return String(candidates[i]).trim();
      }

      return fallback || '';
    }

    function municipalityAliasKey(name) {
      var n = normalizeName(name);

      // Puerto Princesa HUC naming variants
      if (
        n === 'PUERTOPRINCESA' ||
        n === 'PUERTOPRINCESACITY' ||
        n === 'CITYOFPUERTOPRINCESA'
      ) {
        return 'PUERTO_PRINCESA';
      }

      // Palawan municipality historically known as Marcos and now
      // commonly written as Rizal (Marcos) / Rizal.
      if (
        n === 'RIZAL' ||
        n === 'RIZALMARCOS' ||
        n === 'MARCOS' ||
        n === 'DRJOSEP RIZAL' ||
        n === 'DRJOSEP RIZALMUNICIPALITY' ||
        n === 'DRJOSEP.RIZAL'
      ) {
        return 'RIZAL_MARCOS';
      }

      return n;
    }

    function canonicalMunicipalityName(name) {
      var key = municipalityAliasKey(name);

      if (key === 'PUERTO_PRINCESA') {
        return 'CITY OF PUERTO PRINCESA';
      }

      if (key === 'RIZAL_MARCOS') {
        return 'RIZAL (MARCOS)';
      }

      return String(name || '').trim();
    }

    function displayMunicipalityName(name) {
      var key = municipalityAliasKey(name);

      if (key === 'PUERTO_PRINCESA') return 'Puerto Princesa';
      if (key === 'RIZAL_MARCOS') return 'Rizal (Marcos)';

      return String(name || '').trim();
    }

    function municipalityNamesMatch(a, b) {
      var ak = municipalityAliasKey(a);
      var bk = municipalityAliasKey(b);
      return ak === bk;
    }

    function findSheetRecord(name) {
      var target = municipalityAliasKey(name);
      if (!target) return null;

      for (var i=0; i<sheetData.length; i++) {
        if (municipalityAliasKey(sheetData[i].Municipality) === target) {
          return sheetData[i];
        }
      }

      return null;
    }

    function getBackendMunicipalityName(name) {
      var record = findSheetRecord(name);
      return record ? String(record.Municipality).trim() :
        canonicalMunicipalityName(name);
    }

    function showLoader(msg) {
      var el = document.getElementById('loader');
      el.textContent = msg || 'Kinukuha ang data...';
      el.style.display = 'block';
    }

    function hideLoader() {
      document.getElementById('loader').style.display = 'none';
    }

    function showError(msg) {
      var el = document.getElementById('errorToast');
      el.textContent = '⚠ ' + msg;
      el.style.display = 'block';
      setTimeout(function(){ el.style.display='none'; }, 7000);
    }

    function computeBreaks(data, key) {
      key = key || 'Active';

      var vals = data
        .map(function(r){ return Number(r[key]) || 0; })
        .filter(function(v){ return v > 0; })
        .sort(function(a,b){ return a-b; });

      if (!vals.length) return [0,0,0,0];

      return [
        vals[Math.floor(vals.length*.25)] || 0,
        vals[Math.floor(vals.length*.50)] || 0,
        vals[Math.floor(vals.length*.75)] || 0,
        vals[vals.length-1] || 0
      ];
    }

    function getColor(active, customBreaks) {
      active = Number(active) || 0;
      if (active <= 0) return '#d4d4d4';

      var b = customBreaks || breaks;

      return active > b[3] ? '#08306b' :
             active > b[2] ? '#1565c0' :
             active > b[1] ? '#4292c6' :
             active > b[0] ? '#9ecae1' :
                             '#deebf7';
    }

    function addLegend() {
      if (legendControl) map.removeControl(legendControl);

      legendControl = L.control({position:'bottomright'});

      legendControl.onAdd = function() {
        var div = L.DomUtil.create('div','info legend');
        var colors = ['#d4d4d4','#deebf7','#9ecae1','#4292c6','#1565c0','#08306b'];
        var b = breaks;

        var labels = [
          'Walang data',
          '1 – ' + (b[0] || 0).toLocaleString(),
          ((b[0] || 0)+1).toLocaleString() + ' – ' + (b[1] || 0).toLocaleString(),
          ((b[1] || 0)+1).toLocaleString() + ' – ' + (b[2] || 0).toLocaleString(),
          ((b[2] || 0)+1).toLocaleString() + ' – ' + (b[3] || 0).toLocaleString(),
          '> ' + (b[3] || 0).toLocaleString()
        ];

        div.innerHTML = '<strong>Active HHs</strong>' +
          colors.map(function(c,i){
            return '<br><i style="background:'+c+'"></i>'+labels[i];
          }).join('');

        return div;
      };

      legendControl.addTo(map);
    }

    function loadMapShapes() {
      showLoader('Kinukuha ang map boundaries...');

      Promise.all([
        fetch(muniGeoJsonUrl, {cache:'no-store'}).then(function(r){
          if (!r.ok) throw new Error('Municipality GeoJSON HTTP '+r.status);
          return r.json();
        }),
        fetch(hucGeoJsonUrl, {cache:'no-store'}).then(function(r){
          if (!r.ok) throw new Error('HUC GeoJSON HTTP '+r.status);
          return r.json();
        })
      ])
      .then(function(results){
        var muniData = results[0];
        var hucData = results[1];

        if (!muniData.features || !Array.isArray(muniData.features)) {
          throw new Error('Municipality GeoJSON has no valid features.');
        }
        if (!hucData.features || !Array.isArray(hucData.features)) {
          throw new Error('HUC GeoJSON has no valid features.');
        }

        console.log('Municipality features:', muniData.features.length);
        console.log('HUC features:', hucData.features.length);

        drawMunicipalityLayer(muniData);
        drawHucLayer(hucData);

        var allLayers = [];
        if (municipalLayer) allLayers.push(municipalLayer);
        if (hucLayer) allLayers.push(hucLayer);

        // Keep the province dashboard focused on Palawan.
        // Do not fit to the raw GeoJSON extent because the source boundary
        // datasets may contain features outside Palawan.
        map.fitBounds(PALAWAN_BOUNDS, {padding:[20,20]});

        hideLoader();
      })
      .catch(function(err){
        hideLoader();
        showError('Hindi ma-load ang mapa: ' + err.message);
        console.error(err);
      });
    }

    function polygonStyle(feature) {
      var name = featureName(feature);
      var record = findSheetRecord(name);

      return {
        fillColor: getColor(record ? record.Active : 0),
        weight: 1.5,
        opacity: 1,
        color: '#ffffff',
        fillOpacity: 0.8
      };
    }

    function highlight(layer) {
      layer.setStyle({
        weight: 3,
        color: '#222',
        fillOpacity: 0.95
      });

      if (layer.bringToFront) layer.bringToFront();
    }

    function resetPolygon(layer) {
      if (municipalLayer) municipalLayer.resetStyle(layer);
      if (hucLayer) hucLayer.resetStyle(layer);
    }

    function onMuniFeature(feature, layer, isHuc) {
      var rawName = featureName(feature, isHuc ? 'PUERTO PRINCESA' : '');
      var name = displayMunicipalityName(rawName);
      var backendName = getBackendMunicipalityName(rawName);
      var nameUpper = normalizeName(name);

      if (!nameUpper) {
        console.warn('Map feature has no municipality name:', feature.properties);
        return;
      }

      layer.bindTooltip(name, {
        sticky:true,
        direction:'top',
        opacity:.95
      });

      layer.on('mouseover', function(){
        highlight(layer);

        if (!lockedArea) {
          var record = findSheetRecord(name);

          infoPanel.update({
            Name: name,
            Level: isHuc ? 'Highly Urbanized City' : 'Municipality',
            Active: record ? record.Active : 0,
            Inactive: record ? record.Inactive : 0,
            Total: record ? record.Total : 0
          });
        }
      });

      layer.on('mouseout', function(){
        resetPolygon(layer);
        if (!lockedArea) infoPanel.update();
      });

      layer.on('click', function(){
        lockedArea = name;
        currentMuni = name;
        map.fitBounds(layer.getBounds(), {padding:[25,25]});
        drillDownToBarangays(backendName, name);
      });
    }

    function isPalawanMunicipalityFeature(feature) {
      var p = feature && feature.properties ? feature.properties : {};

      var provinceName = normalizeName(
        p.ADM2_EN || p.PROVINCE || p.PROVINCE_NAME ||
        p.ADM2_NAME || p.province || ''
      );

      var provinceCode = String(
        p.ADM2_PCODE || p.PROVINCE_PCODE ||
        p.ADM2_CODE || p.province_code || ''
      ).toUpperCase().trim();

      // Palawan province PSGC code.
      return provinceCode === 'PH17053' || provinceName === 'PALAWAN';
    }

    function filterPalawanFeatures(data) {
      if (!data || !Array.isArray(data.features)) {
        return {type:'FeatureCollection', features:[]};
      }

      var filtered = data.features.filter(isPalawanMunicipalityFeature);

      console.log(
        'Municipality boundary filter:',
        data.features.length,
        'total features ->',
        filtered.length,
        'Palawan features'
      );

      return {
        type: 'FeatureCollection',
        features: filtered
      };
    }

    function drawMunicipalityLayer(data) {
      if (municipalLayer) map.removeLayer(municipalLayer);

      data = filterPalawanFeatures(data);

      municipalLayer = L.geoJSON(data, {
        style: polygonStyle,
        onEachFeature: function(feature, layer){
          onMuniFeature(feature, layer, false);
        }
      }).addTo(map);

      municipalLayer.bringToBack();
    }

    function isPalawanHucFeature(feature) {
      var p = feature && feature.properties ? feature.properties : {};
      var provinceName = normalizeName(
        p.ADM2_EN || p.PROVINCE || p.PROVINCE_NAME ||
        p.ADM2_NAME || p.province || ''
      );
      var provinceCode = String(
        p.ADM2_PCODE || p.PROVINCE_PCODE ||
        p.ADM2_CODE || p.province_code || ''
      ).toUpperCase().trim();

      var municipality = p.ADM3_EN || p.NAME_2 ||
        p.MUNICIPALITY || p.MUN_NAME || p.NAME || '';

      return provinceCode === 'PH17053' ||
             provinceName === 'PALAWAN' ||
             municipalityAliasKey(municipality) === 'PUERTO_PRINCESA';
    }

    function filterPalawanHucFeatures(data) {
      if (!data || !Array.isArray(data.features)) {
        return {type:'FeatureCollection', features:[]};
      }

      return {
        type:'FeatureCollection',
        features:data.features.filter(isPalawanHucFeature)
      };
    }

    function drawHucLayer(data) {
      if (hucLayer) map.removeLayer(hucLayer);

      data = filterPalawanHucFeatures(data);

      /*
       * Puerto Princesa is supplied by a separate HUC GeoJSON.
       * It is intentionally kept as a separate interactive layer.
       */
      hucLayer = L.geoJSON(data, {
        style: polygonStyle,
        onEachFeature: function(feature, layer){
          onMuniFeature(feature, layer, true);
        }
      }).addTo(map);

      hucLayer.bringToFront();
    }

    var infoPanel = L.control({position:'topright'});

    infoPanel.onAdd = function() {
      this._div = L.DomUtil.create('div','info');
      this.update();
      return this._div;
    };

    infoPanel.update = function(props) {
      if (!props) {
        this._div.innerHTML =
          '<h4>Impormasyon</h4>' +
          '<span style="color:#888;">I-hover ang mouse sa lugar</span>';
        return;
      }

      this._div.innerHTML =
        '<h4>' + props.Level + ' Profile</h4>' +
        '<b>' + props.Name + '</b><br><br>' +
        '<span style="color:green;">✔ Active: ' +
        (Number(props.Active)||0).toLocaleString() + '</span><br>' +
        '<span style="color:#c0392b;">✘ Inactive: ' +
        (Number(props.Inactive)||0).toLocaleString() + '</span><br>' +
        '<b>Total: ' + (Number(props.Total)||0).toLocaleString() + '</b>';
    };

    infoPanel.addTo(map);

    function drillDownToBarangays(m, displayName) {
      showLoader('Kinukuha ang barangay data...');

      var backendName = getBackendMunicipalityName(m);
      var uiName = displayName || displayMunicipalityName(m);

      google.script.run
        .withSuccessHandler(function(d){
          hideLoader();

          lockedArea = uiName;
          currentMuni = uiName;
          currentBrgyData = Array.isArray(d) ? d : [];
          currentView = 'barangay';

          drawBrgy(backendName, currentBrgyData, uiName);

          document.getElementById('tablePanel').style.display = 'flex';
          renderSummaryTable();

          document.getElementById('btnBackToSummary').style.display = 'inline';
          document.getElementById('btnBackToSummary').onclick = function(){
            if (currentType) renderMunicipalityBreakdown(currentType);
            else renderProvinceSummary();
          };
        })
        .withFailureHandler(function(err){
          hideLoader();
          showError('Hindi ma-load ang barangay data: ' + (err && err.message ? err.message : err));
        })
        .getBarangayData(m);
    }

    function drawBrgy(m, d, displayName) {
      if (barangayLayer) {
        map.removeLayer(barangayLayer);
        barangayLayer = null;
      }

      if (cachedBrgyGeoJson) {
        renderB(m,d,cachedBrgyGeoJson,displayName);
        return;
      }

      fetch(brgyGeoJsonUrl, {cache:'no-store'})
        .then(function(r){
          if (!r.ok) throw new Error('Barangay GeoJSON HTTP '+r.status);
          return r.json();
        })
        .then(function(j){
          cachedBrgyGeoJson = j;
          renderB(m,d,j,displayName);
        })
        .catch(function(err){
          showError('Hindi ma-load ang barangay boundaries: '+err.message);
        });
    }

    function isPalawanBarangayFeature(feature) {
      var p = feature && feature.properties ? feature.properties : {};

      var provinceName = normalizeName(
        p.ADM2_EN || p.PROVINCE || p.PROVINCE_NAME || ''
      );

      var provinceCode = String(
        p.ADM2_PCODE || p.PROVINCE_PCODE || ''
      ).toUpperCase().trim();

      // Palawan PSGC province code is PH17053.
      if (provinceCode === 'PH17053') return true;
      if (provinceName === 'PALAWAN') return true;

      // Puerto Princesa is a HUC, so some boundary datasets may not
      // classify its province field consistently. Its municipality name
      // is sufficient to keep it inside this dashboard.
      var muniName = p.ADM3_EN || p.NAME_2 || p.MUNICIPALITY || p.MUN_NAME || '';
      return municipalityAliasKey(muniName) === 'PUERTO_PRINCESA';
    }

    function renderB(m,d,j,displayName) {
      var mCanonical = getBackendMunicipalityName(m);
      var mUpper = normalizeName(mCanonical);
      var bBreaks = computeBreaks(d);

      var filtered = (j.features || []).filter(function(f){
        var prop =
          (f.properties && (
            f.properties.ADM3_EN ||
            f.properties.NAME_2 ||
            f.properties.MUNICIPALITY ||
            f.properties.MUN_NAME
          )) || '';

        // TWO conditions are mandatory:
        // 1) barangay belongs to the selected municipality
        // 2) barangay belongs to Palawan
        return isPalawanBarangayFeature(f) &&
               municipalityNamesMatch(prop, mCanonical);
      });

      console.log(
        'Barangay features for',
        displayName || m,
        'within Palawan:',
        filtered.length
      );

      console.log(
        'Barangay features for',
        displayName || m,
        ':',
        filtered.length
      );

      barangayLayer = L.geoJSON(
        {type:'FeatureCollection',features:filtered},
        {
          style:function(f){
            var bName = String(
              (f.properties && (f.properties.ADM4_EN || f.properties.NAME_3 ||
                f.properties.BARANGAY || f.properties.NAME)) || ''
            ).trim();

            var b = d.find(function(x){
              return normalizeName(x.Barangay) === normalizeName(bName);
            }) || {Active:0};

            return {
              fillColor:getColor(b.Active,bBreaks),
              weight:1,
              color:'#444',
              fillOpacity:.8
            };
          },

          onEachFeature:function(f,l){
            var bName = String(
              (f.properties && (f.properties.ADM4_EN || f.properties.NAME_3 ||
                f.properties.BARANGAY || f.properties.NAME)) || 'Unknown Barangay'
            );

            l.on('mouseover',function(){
              l.setStyle({weight:2.5,color:'#111',fillOpacity:.95});

              var b = d.find(function(x){
                return normalizeName(x.Barangay) === normalizeName(bName);
              }) || {Active:0,Inactive:0,Total:0};

              infoPanel.update({
                Name:bName,
                Level:'Barangay',
                Active:b.Active,
                Inactive:b.Inactive,
                Total:b.Total
              });
            });

            l.on('mouseout',function(){
              if (barangayLayer) barangayLayer.resetStyle(l);
              if (!lockedArea) infoPanel.update();
            });
          }
        }
      ).addTo(map);

      if (barangayLayer.getLayers().length) {
        map.fitBounds(barangayLayer.getBounds(), {padding:[25,25]});
      }

      document.getElementById('backBtn').style.display = 'block';
    }

    function renderSummaryTable() {
      document.getElementById('panelTitle').textContent =
        currentMuni + ' — Barangay Summary';

      document.getElementById('tableHead').innerHTML =
        '<tr><th>Barangay</th>' +
        '<th class="clickable-th" onclick="renderDrilldown(\'Active\')">Active ↕</th>' +
        '<th class="clickable-th" onclick="renderDrilldown(\'Inactive\')">Inactive ↕</th>' +
        '<th>Total</th></tr>';

      document.getElementById('tableBody').innerHTML =
        currentBrgyData.map(function(b){
          return '<tr>' +
            '<td>'+b.Barangay+'</td>' +
            '<td>'+(Number(b.Active)||0).toLocaleString()+'</td>' +
            '<td>'+(Number(b.Inactive)||0).toLocaleString()+'</td>' +
            '<td>'+(Number(b.Total)||0).toLocaleString()+'</td>' +
            '</tr>';
        }).join('');
    }

    function renderProvinceSummary() {
      currentView = 'province';
      currentType = '';
      document.getElementById('tablePanel').style.display = 'flex';
      document.getElementById('panelTitle').textContent =
        'Palawan Province-Wide Summary';

      var active = 0;
      var inactive = 0;

      sheetData.forEach(function(r){
        active += Number(r.Active)||0;
        inactive += Number(r.Inactive)||0;
      });

      var total = active + inactive;

      document.getElementById('btnBackToSummary').style.display = 'none';

      document.getElementById('tableHead').innerHTML =
        '<tr><th>Category</th><th>Count</th></tr>';

      document.getElementById('tableBody').innerHTML =
        '<tr style="cursor:pointer;" onclick="renderMunicipalityBreakdown(\'Active\')">' +
        '<td><strong>Active</strong></td><td>'+active.toLocaleString()+'</td></tr>' +
        '<tr style="cursor:pointer;" onclick="renderMunicipalityBreakdown(\'Inactive\')">' +
        '<td><strong>Inactive</strong></td><td>'+inactive.toLocaleString()+'</td></tr>' +
        '<tr><td><strong>Total</strong></td><td><strong>'+total.toLocaleString()+'</strong></td></tr>';
    }

    function renderMunicipalityBreakdown(type) {
      currentView = 'municipality';
      currentType = type;

      document.getElementById('panelTitle').textContent =
        'Municipality Breakdown - ' + type;

      document.getElementById('btnBackToSummary').style.display = 'inline';
      document.getElementById('btnBackToSummary').onclick = renderProvinceSummary;

      var rows = sheetData.slice().sort(function(a,b){
        return (Number(b[type])||0) - (Number(a[type])||0);
      });

      document.getElementById('tableHead').innerHTML =
        '<tr><th>Municipality / City</th><th>'+type+'</th></tr>';

      var body = document.getElementById('tableBody');
      body.innerHTML = '';

      rows.forEach(function(r){
        var tr = document.createElement('tr');
        tr.style.cursor = 'pointer';

        var td1 = document.createElement('td');
        td1.textContent = r.Municipality;

        var td2 = document.createElement('td');
        td2.textContent = (Number(r[type])||0).toLocaleString();

        tr.appendChild(td1);
        tr.appendChild(td2);

        tr.addEventListener('click',function(){
          provinceToBarangay(r.Municipality);
        });

        body.appendChild(tr);
      });
    }

    function provinceToBarangay(muni) {
      drillDownToBarangays(
        getBackendMunicipalityName(muni),
        displayMunicipalityName(muni)
      );
    }

    function renderDrilldown(type) {
      var keys = new Set();

      currentBrgyData.forEach(function(b){
        var breakdown =
          type === 'Active'
          ? (b.ActiveBreakdown || {})
          : (b.InactiveBreakdown || {});

        Object.keys(breakdown).forEach(function(k){ keys.add(k); });
      });

      var kArr = Array.from(keys).sort();

      document.getElementById('tableHead').innerHTML =
        '<tr><th>Barangay</th>' +
        kArr.map(function(k){ return '<th>'+k+'</th>'; }).join('') +
        '<th>Total</th></tr>';

      document.getElementById('tableBody').innerHTML =
        currentBrgyData.map(function(b){
          var breakdown =
            type === 'Active'
            ? (b.ActiveBreakdown || {})
            : (b.InactiveBreakdown || {});

          return '<tr><td>'+b.Barangay+'</td>' +
            kArr.map(function(k){
              return '<td>'+(Number(breakdown[k])||0).toLocaleString()+'</td>';
            }).join('') +
            '<td>'+
            (Number(type === 'Active' ? b.Active : b.Inactive)||0).toLocaleString()+
            '</td></tr>';
        }).join('');

      document.getElementById('btnBackToSummary').style.display = 'inline';
    }

    function refreshData() {
      showLoader('Nagre-refresh ng data...');

      google.script.run
        .withSuccessHandler(function(){
          google.script.run
            .withSuccessHandler(function(d){
              sheetData = Array.isArray(d) ? d : [];
              breaks = computeBreaks(sheetData);

              document.getElementById('lastRefreshTime').textContent =
                'Latest refresh: ' + new Date().toLocaleTimeString();

              if (municipalLayer) municipalLayer.setStyle(polygonStyle);
              if (hucLayer) hucLayer.setStyle(polygonStyle);
              addLegend();

              hideLoader();

              if (currentView === 'province') renderProvinceSummary();
              else if (currentView === 'municipality') renderMunicipalityBreakdown(currentType);
              else if (currentView === 'barangay') renderSummaryTable();
            })
            .withFailureHandler(function(err){
              hideLoader();
              showError('Refresh failed: ' + (err && err.message ? err.message : err));
            })
            .getMunicipalData();
        })
        .withFailureHandler(function(err){
          hideLoader();
          showError('Cache clear failed: ' + (err && err.message ? err.message : err));
        })
        .clearMapCache();
    }

    function resetMap() {
      lockedArea = null;
      currentMuni = '';
      currentBrgyData = [];
      currentView = 'province';
      currentType = '';

      if (barangayLayer) {
        map.removeLayer(barangayLayer);
        barangayLayer = null;
      }

      map.fitBounds(PALAWAN_BOUNDS, {padding:[20,20]});
      document.getElementById('backBtn').style.display = 'none';

      if (municipalLayer) municipalLayer.bringToBack();
      if (hucLayer) hucLayer.bringToFront();

      renderProvinceSummary();
      infoPanel.update();
    }

    function onDataReceived(data) {
      sheetData = Array.isArray(data) ? data : [];
      breaks = computeBreaks(sheetData);

      document.getElementById('lastRefreshTime').textContent =
        'Latest refresh: ' + new Date().toLocaleTimeString();

      hideLoader();

      addLegend();
      loadMapShapes();
      renderProvinceSummary();

      console.log('Municipality records:', sheetData.length);
      console.log('Data:', sheetData);
    }

    document.addEventListener('DOMContentLoaded',function(){
      showLoader('Kinukuha ang data...');

      google.script.run
        .withSuccessHandler(onDataReceived)
        .withFailureHandler(function(err){
          hideLoader();
          showError('Hindi ma-load ang data: ' + (err && err.message ? err.message : err));
        })
        .getMunicipalData();

      // Data is released on a periodic schedule.
      // Keep the dashboard's data vintage fixed until the next official update.
      document.getElementById('dataAsOf').textContent = 'Data as of: September 2, 2026';
      document.getElementById('dataAsOfTable').textContent = 'Data as of: September 2, 2026';
    });
  </script>
</body>
</html>
